services:
  postgres:
    image: postgres:16-alpine
    container_name: trendsong_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: trendsong
      POSTGRES_PASSWORD: trendsong_secret
      POSTGRES_DB: trendsong
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
